name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 双格式产物自检（verify.mjs）
        run: node skills/dsh-plugin-guide/scripts/verify.mjs
